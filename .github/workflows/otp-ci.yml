name: Transit Fuel OTP tests
on:
  pull_request:
    branches: [release/v1.0.0]
  push:
    branches: [feature/iran-turkey-sms-2fa]
jobs:
  node-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check server/app.js
          node --check server/sms-auth.js
          node --check company.js
          node --check tests/sms-auth.test.js
      - name: Unit and API tests
        run: node --test tests/*.test.js
  firefox-otp:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Firefox browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps firefox
      - name: Firefox real UI authentication smoke test
        run: python tests/browser_sms.py
